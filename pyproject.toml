[project]
name = "churn-intelligence-engine"
version = "1.0.0"
description = "Customer Churn Prediction & Retention Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.25",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "shap>=0.45",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "mlflow>=2.9",
  "optuna>=3.4",
  "streamlit>=1.30",
  "plotly>=5.18",
  "matplotlib>=3.8",
  "structlog>=24.1",
  "python-multipart>=0.0.9",
  "httpx>=0.25",
  "pytest>=7.4",
  "pytest-cov>=4.1",
]

[project.optional-dependencies]
dev = ["black", "isort", "flake8", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.coverage.run]
omit = ["src/dashboard/*", "src/models/training.py"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["artifacts/", ".pytest_cache/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
